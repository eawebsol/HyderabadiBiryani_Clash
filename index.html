      // --- WEB AUDIO API SOUND GENERATOR ---
      const playSynthesizedSound = (type) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const now = ctx.currentTime;

          if (type === 'vote') {
            // Sizzle pop
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(780, now + 0.12);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
          } else if (type === 'toss') {
            // Coin tick
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(950, now);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.08);
          } else if (type === 'win') {
            // Victory fanfare
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(freq, now + i * 0.1);
              gain.gain.setValueAtTime(0.15, now + i * 0.1);
              gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.35);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + i * 0.1);
              osc.stop(now + i * 0.1 + 0.35);
            });
          } else if (type === 'error') {
            // Baigan error buzzer
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.setValueAtTime(110, now + 0.12);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.28);
          }
        } catch (e) {
          // AudioContext might be blocked or unavailable, ignore safely
        }

        Sparkles: ({ className = "w-4 h-4 text-zafran-400" }) => (

            <path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />

        ),
        Warning: ({ className = "w-5 h-5 text-amber-400" }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />

        ),
        ShieldCheck: ({ className = "w-4 h-4" }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />

        Plus: ({ className = "w-4 h-4" }) => (

        Close: ({ className = "w-5 h-5" }) => (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">

      // --- MAIN COMPONENT ---
      function App() {
        // Spots list loaded from LocalStorage or seeded with authentic dataset
        const [spots, setSpots] = useState(() => {
          try {
            const saved = localStorage.getItem('hyderabad_biryani_spots');
            if (saved) {
              const parsed = JSON.parse(saved);
              // Backfill or reconcile spiceTier if loading from older localStorage
              return parsed.map(spot => {
                if (spot.spiceTier) return spot;
                if (spot.id === 'grand-hotel-abids') return { ...spot, spiceTier: 'Mild', spiceLevel: 2 };
                if (spot.id === 'sohail-malakpet' || spot.id === 'shadab-ghansi-bazaar') return { ...spot, spiceTier: 'Medium', spiceLevel: 4 };
                return { ...spot, spiceTier: 'Spicy', spiceLevel: 5 };
              });
            }
          } catch (e) {}
          return INITIAL_SPOTS;
        });

        // Track user session votes (prevents duplicate voting on same spot)
        const [votedIds, setVotedIds] = useState(() => {
          try {
            const saved = localStorage.getItem('hyderabad_biryani_voted_ids');
            if (saved) return JSON.parse(saved);
          } catch (e) {}
          return [];
        });

        // Filter states
        const [maxDistance, setMaxDistance] = useState(15);
        const [onlySecretGems, setOnlySecretGems] = useState(false);
        const [selectedSpiceLevel, setSelectedSpiceLevel] = useState('all'); // 'all', 'Mild', 'Medium', 'Spicy'
        const [selectedArea, setSelectedArea] = useState('all'); // 'all' or specific locality/area
        const [searchQuery, setSearchQuery] = useState('');
        const [sortBy, setSortBy] = useState('votes'); // 'votes', 'distance', 'spice'

        // UI states
        const [toasts, setToasts] = useState([]);
        const [isTossing, setIsTossing] = useState(false);
        const [tossWinner, setTossWinner] = useState(null);
        const [showAddModal, setShowAddModal] = useState(false);
        const [showMasterDirectoryModal, setShowMasterDirectoryModal] = useState(false);
        const [showSlangGlossary, setShowSlangGlossary] = useState(false);
        const [justVotedId, setJustVotedId] = useState(null);
        const [copiedToast, setCopiedToast] = useState(false);

        // Sync spots and voted IDs to localStorage
        useEffect(() => {
          try {
            localStorage.setItem('hyderabad_biryani_spots', JSON.stringify(spots));
          } catch (e) {}
        }, [spots]);

        useEffect(() => {
          try {
            localStorage.setItem('hyderabad_biryani_voted_ids', JSON.stringify(votedIds));
          } catch (e) {}
        }, [votedIds]);

        // Trigger distance slang alert if user cranks slider above 12km
        const lastAlertedDistance = useRef(null);
        useEffect(() => {
          if (maxDistance >= 13 && lastAlertedDistance.current !== maxDistance) {
            lastAlertedDistance.current = maxDistance;
            addToast("✈️ Arey bhai, Shamshabad flight pakad ke jaate kya biryani khane? Aas-paas ka filter lagao!", "warning");
          }
        }, [maxDistance]);

        // Toast Helper
        const addToast = (message, type = 'info') => {
          playSynthesizedSound(type === 'error' || type === 'warning' ? 'error' : 'vote');
          const id = Date.now() + Math.random();
          setToasts(prev => [...prev.slice(-3), { id, message, type }]);
          setTimeout(() => {
            setToasts(prev => prev.filter(t => t.id !== id));
          }, 4200);
        };

        // Unique areas extracted dynamically from spots dataset
        const availableAreas = useMemo(() => {
          const areaMap = new Map();
          spots.forEach(spot => {
            const loc = spot.location.trim();
            areaMap.set(loc, (areaMap.get(loc) || 0) + 1);
          });
          return Array.from(areaMap.entries()).map(([name, count]) => ({ name, count }));
        }, [spots]);

        // Search directory for spots not yet in active clash
        const directoryMatches = useMemo(() => {
          if (!searchQuery.trim() || searchQuery.trim().length < 2) return [];
          const q = searchQuery.toLowerCase().trim();
          return MASTER_HYDERABAD_DIRECTORY.filter(dirSpot => {
            const alreadyInClash = spots.some(s => s.id === dirSpot.id || s.name.toLowerCase() === dirSpot.name.toLowerCase());
            if (alreadyInClash) return false;
            return (
              dirSpot.name.toLowerCase().includes(q) ||
              dirSpot.location.toLowerCase().includes(q) ||
              dirSpot.dish.toLowerCase().includes(q) ||
              (dirSpot.landmark && dirSpot.landmark.toLowerCase().includes(q))
            );
          });
        }, [searchQuery, spots]);

        // Add spot from directory directly to live cards
        const addSpotFromDirectory = (dirSpot) => {
          if (spots.some(s => s.id === dirSpot.id)) {
            addToast(`Arey bawa! "${dirSpot.name}" already live voting board pe hai!`, "info");
            return;
          }
          setSpots(prev => [dirSpot, ...prev]);
          playSynthesizedSound('win');
          if (window.confetti) {
            window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
          }
          addToast(`🔥 Zabardast! "${dirSpot.name}" add ho gaya group clash me!`, "success");
        };

        // Load all 26 master spots to live board
        const loadAllMasterSpots = () => {
          setSpots(MASTER_HYDERABAD_DIRECTORY);
          playSynthesizedSound('win');
          if (window.confetti) {
            window.confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 } });
          }
          addToast(`👑 Poora Hyderabad loaded! All 26 authentic spots now in voting!`, "success");
        };

        // Smart auto-detect and add custom restaurant
        const handleSmartAutoAdd = (query) => {
          if (!query.trim()) return;
          const cleanQuery = query.trim();

          // Intelligent area detection from query
          const areaKeywords = [
            'Malakpet', 'Panjagutta', 'Basheerbagh', 'Lakdikapul', 'Ghansi Bazaar',
            'Charminar', 'Abids', 'Tolichowki', 'Secunderabad', 'Banjara Hills',
            'Jubilee Hills', 'Mehdipatnam', 'RTC X Roads', 'Masab Tank', 'Barkas',
            'Madhapur', 'Gachibowli', 'Kukatpally', 'Dilsukhnagar', 'Alwal', 'Nagole'
          ];
          const detectedArea = areaKeywords.find(a => cleanQuery.toLowerCase().includes(a.toLowerCase())) || 'Hyderabad Gali';

          const newSpot = {
            id: 'custom-' + Date.now(),
            name: cleanQuery.replace(/\b(in|at|near)\b.*/i, '').trim() || cleanQuery,
            location: detectedArea,
            dish: 'Special Kacchi Dum Mutton Biryani + Mirchi ka Salan',
            parking: 'Roadside gali adjustment / auto friendly',
            distance: 5.5,
            isSecretGem: true,
            votes: 1,
            tag: 'User Custom Gali Adda',
            spiceLevel: 4,
            spiceTier: 'Medium',
            meatType: 'Mutton & Chicken',
            price: '₹₹',
            timings: '12:00 PM - 1:30 AM',
            specialWarning: null,
            landmark: 'Local Landmark Gali'
          };

          setSpots(prev => [newSpot, ...prev]);
          setSearchQuery('');
          playSynthesizedSound('win');
          if (window.confetti) {
            window.confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 } });
          }
          addToast(`🔥 Zabardast! "${newSpot.name}" details ke saath card pe aa gaya!`, "success");
        };

        // Filter and sort spots (respecting Distance, Secret Gems, Spice Level, Area, and Search)
        const filteredSpots = useMemo(() => {
          return spots
            .filter(spot => {
              if (spot.distance > maxDistance) return false;
              if (onlySecretGems && !spot.isSecretGem) return false;
              if (selectedSpiceLevel !== 'all' && spot.spiceTier !== selectedSpiceLevel) return false;
              if (selectedArea !== 'all' && !spot.location.toLowerCase().includes(selectedArea.toLowerCase())) return false;
              if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase();
                const matchName = spot.name.toLowerCase().includes(q);
                const matchLoc = spot.location.toLowerCase().includes(q);
                const matchDish = spot.dish.toLowerCase().includes(q);
                const matchSpice = (spot.spiceTier || '').toLowerCase().includes(q);
                if (!matchName && !matchLoc && !matchDish && !matchSpice) return false;
              }
              return true;
            })
            .sort((a, b) => {
              if (sortBy === 'votes') return b.votes - a.votes;
              if (sortBy === 'distance') return a.distance - b.distance;
              if (sortBy === 'spice') return b.spiceLevel - a.spiceLevel;
              return 0;
            });
        }, [spots, maxDistance, onlySecretGems, selectedSpiceLevel, selectedArea, searchQuery, sortBy]);

        // Spice Level counts across available dataset
        const spiceCounts = useMemo(() => {
          return {
            all: spots.length,
            Mild: spots.filter(s => s.spiceTier === 'Mild').length,
            Medium: spots.filter(s => s.spiceTier === 'Medium').length,
            Spicy: spots.filter(s => s.spiceTier === 'Spicy').length
          };
        }, [spots]);

        // Leaderboard stats & group winner
        const allSortedByVotes = useMemo(() => {
          return [...spots].sort((a, b) => b.votes - a.votes);
        }, [spots]);

        const topSpot = allSortedByVotes[0];
        const secondSpot = allSortedByVotes[1];
        const totalVotes = spots.reduce((acc, s) => acc + s.votes, 0);

        // --- UPVOTE HANDLER WITH STREET-SLANG DUPLICATE CHECK ---
        const handleVote = (spotId) => {
          if (votedIds.includes(spotId)) {
            // Authentic duplicate vote street-slang error
            addToast("🛑 Kya miyan, ek hi dukan ko do do baar vote daalre? Chindi chorgiri nako karo!", "error");
            return;
          }

          // Successful vote
          playSynthesizedSound('vote');
          setJustVotedId(spotId);
          setTimeout(() => setJustVotedId(null), 1000);

          setSpots(prev =>
            prev.map(s => s.id === spotId ? { ...s, votes: s.votes + 1 } : s)
          );
          setVotedIds(prev => [...prev, spotId]);

          // Confetti burst for leading spot vote
          if (spotId === topSpot.id && window.confetti) {
            window.confetti({
              particleCount: 40,
              spread: 60,
              origin: { y: 0.7 }
            });
          }

          addToast("🔥 Zabardast! Ek dum solid vote gir gaya!", "success");
        };

        // Undo vote if user wants to change
        const handleUndoVote = (spotId) => {
          setSpots(prev =>
            prev.map(s => s.id === spotId ? { ...s, votes: Math.max(0, s.votes - 1) } : s)
          );
          setVotedIds(prev => prev.filter(id => id !== spotId));
          addToast("Hatt miyan! Vote wapas le liye? Chalo theek hai.", "info");
        };

        // --- TOSS KARO (RANDOM DECIDER) WITH ANIMATION & SOUND ---
        const handleTossKaro = () => {
          if (filteredSpots.length === 0) {
            const areaMsg = selectedArea !== 'all' ? ` in "${selectedArea}"` : '';
            const spiceMsg = selectedSpiceLevel !== 'all' ? ` with "${selectedSpiceLevel}" spice` : '';
            addToast(`Baigan! Filter me ek bhi dukan nahi bachi${areaMsg}${spiceMsg}, toss kisme karein?`, "error");
            return;
          }

          setIsTossing(true);
          playSynthesizedSound('toss');

          let counter = 0;
          const interval = setInterval(() => {
            playSynthesizedSound('toss');
            counter++;
            if (counter > 14) {
              clearInterval(interval);
              const luckySpot = filteredSpots[Math.floor(Math.random() * filteredSpots.length)];
              setTossWinner(luckySpot);
              setIsTossing(false);
              playSynthesizedSound('win');

              if (window.confetti) {
                window.confetti({
                  particleCount: 120,
                  spread: 80,
                  origin: { y: 0.5 },
                  colors: ['#f59e0b', '#dc2626', '#fbbf24', '#ffffff']
                });
              }
            }
          }, 90);
        };

        // --- WHATSAPP PLAN LOCKER (1-CLICK CLIPBOARD + HYDERABADI FORMAT) ---
        const handleLockPlanOnWhatsApp = (targetSpot = topSpot) => {
          if (!targetSpot) return;

          const shareText = `🔥 *BIRYANI CLASH: HYDERABAD DECISION LOCKED!* 🔥\n\n` +
            `👑 *Final Spot:* ${targetSpot.name} (${targetSpot.location})\n` +
            `🗳️ *Group Mandate:* ${targetSpot.votes} Votes (${totalVotes > 0 ? Math.round((targetSpot.votes / totalVotes) * 100) : 100}% of group)\n` +
            `🌶️ *Spice Profile:* ${targetSpot.spiceTier || 'Authentic'} (${targetSpot.spiceLevel || 4}/5 Tikha)\n` +
            `🍗 *Must Order:* ${targetSpot.dish}\n` +
            `🚗 *Parking Scene:* ${targetSpot.parking}\n` +
            `📍 *Distance:* ~${targetSpot.distance} km | Timings: ${targetSpot.timings}\n\n` +
            `🗣️ _"Arey bawa chup chap sab log 9:30 PM tak pohcho! Late kare toh khali kushka aur pyaz khana padta!"_\n\n` +
            `✅ Decided via Biryani Clash (No more group chat lafda)`;

          navigator.clipboard.writeText(shareText).then(() => {
            setCopiedToast(true);
            playSynthesizedSound('win');
            if (window.confetti) {
              window.confetti({ particleCount: 60, spread: 70, origin: { y: 0.8 } });
            }
            setTimeout(() => setCopiedToast(false), 3000);
          }).catch(() => {
            // Fallback for older browsers
            prompt("Copy this formatted plan for WhatsApp:", shareText);
          });
        };

        // Reset session votes
        const handleResetVotes = () => {
          if (confirm("Ustaad, sachme poore votes reset karna hai? Naya poll shuru hoga!")) {
            setSpots(INITIAL_SPOTS);
            setVotedIds([]);
            localStorage.removeItem('hyderabad_biryani_spots');
            localStorage.removeItem('hyderabad_biryani_voted_ids');
            addToast("Chalo! Naye sire se degh kholi gayi. Daalo fresh votes!", "info");
          }
        };

        // Parking alert handler
        const triggerParkingAlert = (spot) => {
          if (spot.id === 'meridian-panjagutta') {
            addToast("⚠️ Ustaad, Panjagutta basement me gaadi phasi toh 1 ghanta nikalna mushkil hai! Bumper laga dete!", "warning");
          } else if (spot.id === 'shadab-ghansi-bazaar') {
            addToast("⚠️ Ustaad, Madina building ke paas 4-wheeler leke gaye toh traffic police utha leke chal jaati! Baigan me mil jaata scene!", "warning");
          } else {
            addToast(`⚠️ Ustaad: ${spot.parking}! Gaadi dhyan se lagao nahi toh challan pakka!`, "warning");
          }
        };

        return (
          <div className="min-h-screen bg-[#0a0d14] text-slate-100 flex flex-col font-sans relative overflow-x-hidden">
            {/* Top Atmospheric Nizami Glow */}
            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[320px] bg-gradient-to-b from-amber-600/20 via-red-900/10 to-transparent blur-3xl pointer-events-none -z-10" />

            {/* HEADER */}
            <header className="border-b border-amber-950/40 bg-[#0f1420]/80 backdrop-blur-md sticky top-0 z-30">
              <div className="max-w-6xl mx-auto px-4 py-3 sm:py-4 flex flex-col sm:flex-row items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-amber-500 via-zafran-600 to-red-700 flex items-center justify-center shadow-lg shadow-amber-900/40 border border-amber-400/30">
                    <span className="text-2xl" role="img" aria-label="Biryani Handi">🍗</span>
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] uppercase tracking-widest font-extrabold px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30">
                        Official Group Arbiter
                      </span>
                      <span className="inline-flex items-center gap-1 text-[11px] text-emerald-400 font-medium">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                        Dum Chalu Hai
                      </span>
                    </div>
                    <h1 className="text-xl sm:text-2xl font-black tracking-tight text-white flex items-center gap-2">
                      Biryani Clash <span className="text-amber-400 text-sm font-semibold tracking-normal px-2 py-0.5 rounded bg-amber-950/60 border border-amber-800/40">Hyderabad Edition</span>
                    </h1>
                  </div>
                </div>

                {/* Quick actions & stats in header */}
                <div className="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                  <button
                    onClick={() => {
                      addToast("🚗 Masab Tank aur Panjagutta pe bumper-to-bumper jaam hai bawa! Biryani thandi ho jaati!", "warning");
                    }}
                    className="text-xs px-3 py-1.5 rounded-lg bg-red-950/40 hover:bg-red-900/50 border border-red-800/40 text-red-300 flex items-center gap-1.5 transition active:scale-95"
                    title="Live Traffic Update"
                  >
                    <span>🚗</span>
                    <span className="hidden xs:inline">Check</span> Traffic Jam
                  </button>

                  <button
                    onClick={() => setShowSlangGlossary(true)}
                    className="text-xs px-3 py-1.5 rounded-lg bg-amber-950/40 hover:bg-amber-900/50 border border-amber-700/40 text-amber-300 flex items-center gap-1.5 transition active:scale-95"
                  >
                    <span>🗣️</span>
                    <span>Dakhni Slang Box</span>
                  </button>

                  <button
                    onClick={handleResetVotes}
                    className="text-xs px-2.5 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
                    title="Reset Poll for New Debate"
                  >
                    Reset
                  </button>
                </div>
              </div>

                    onChange={(e) => setDish(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-slate-300 font-bold mb-1">Distance (km)</label>
                    <input
                      type="number"
                      step="0.5"
                      min="1"
                      max="20"
                      value={distance}
                      onChange={(e) => setDistance(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-bold mb-1">Spice Level *</label>
                    <select
                      value={spiceTier}
                      onChange={(e) => setSpiceTier(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-white focus:outline-none focus:border-amber-500 cursor-pointer"
                    >
                      <option value="Mild">🟢 Mild (Mellow Irani)</option>
                      <option value="Medium">🟡 Medium (Classic Dum)</option>
                      <option value="Spicy">🔴 Spicy (Tezz / Masala)</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-slate-300 font-bold mb-1">Parking Scene</label>
                  <input
                    type="text"
                    value={parking}
                    onChange={(e) => setParking(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500"
                  />
                </div>

                <div className="flex items-center gap-2 pt-1">
                  <input
                    type="checkbox"
                    id="secretCheck"
                    checked={isSecretGem}
                    onChange={(e) => setIsSecretGem(e.target.checked)}
                    className="accent-amber-500 rounded"
                  />
                  <label htmlFor="secretCheck" className="text-slate-300 cursor-pointer">
                    Mark as "Secret AI-Blind Spot" (Hyper-local)
                  </label>
                </div>

                <div className="pt-3 flex gap-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold hover:bg-slate-700 transition"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-extrabold transition shadow-lg shadow-amber-950/40"
                  >
                    Add Spot
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      // --- SUBCOMPONENT: MASTER DIRECTORY BROWSER MODAL (26 SPOTS) ---
      function MasterDirectoryModal({ onClose, activeSpotIds, onAddSpot, onLoadAll }) {
        const [modalSearch, setModalSearch] = useState('');
        const [modalArea, setModalArea] = useState('all');
        const [modalSpice, setModalSpice] = useState('all');

        const directoryAreas = useMemo(() => {
          const set = new Set();
          MASTER_HYDERABAD_DIRECTORY.forEach(s => set.add(s.location));
          return Array.from(set);
        }, []);

        const filteredDirectory = useMemo(() => {
          return MASTER_HYDERABAD_DIRECTORY.filter(spot => {
            if (modalArea !== 'all' && !spot.location.toLowerCase().includes(modalArea.toLowerCase())) return false;
            if (modalSpice !== 'all' && spot.spiceTier !== modalSpice) return false;
            if (modalSearch.trim()) {
              const q = modalSearch.toLowerCase().trim();
              const matchName = spot.name.toLowerCase().includes(q);
              const matchLoc = spot.location.toLowerCase().includes(q);
              const matchDish = spot.dish.toLowerCase().includes(q);
              if (!matchName && !matchLoc && !matchDish) return false;
            }
            return true;
          });
        }, [modalSearch, modalArea, modalSpice]);

        return (
          <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-5">
            <div className="bg-[#121624] border border-amber-500/50 rounded-3xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
              {/* Modal Header */}
              <div className="p-4 sm:p-5 border-b border-slate-800 flex items-center justify-between bg-[#151a2b]">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-amber-500 to-purple-700 flex items-center justify-center text-xl shadow">
                    📖
                  </div>
                  <div>
                    <h3 className="text-base sm:text-lg font-black text-white flex items-center gap-2">
                      Hyderabad Master Biryani Directory
                      <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40">
                        26 Authentic Spots
                      </span>
                    </h3>
                    <p className="text-xs text-slate-400">
                      Iconic & secret gali joints across Hyderabad with full authentic details pre-filled.
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    onClick={onLoadAll}
                    className="hidden sm:inline-flex px-3 py-1.5 rounded-xl bg-gradient-to-r from-amber-500 to-zafran-600 hover:from-amber-400 text-black font-extrabold text-xs items-center gap-1.5 shadow cursor-pointer transition active:scale-95"
                  >
                    <span>⚡ Put All 26 On Cards</span>
                  </button>
                  <button
                    onClick={onClose}
                    className="p-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white"
                  >
                    <Icons.Close className="w-5 h-5" />
                  </button>
                </div>
              </div>

              {/* Filters Inside Modal */}
              <div className="p-3.5 bg-slate-900/90 border-b border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-2.5 text-xs">
                <div className="relative w-full sm:w-64">
                  <input
                    type="text"
                    placeholder="Search directory..."
                    value={modalSearch}
                    onChange={(e) => setModalSearch(e.target.value)}
                    className="w-full bg-[#121624] border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500"
                  />
                  <span className="absolute left-2.5 top-2 text-slate-500">🔍</span>
                </div>

                <div className="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                  <select
                    value={modalArea}
                    onChange={(e) => setModalArea(e.target.value)}
                    className="bg-[#121624] border border-slate-700 text-slate-300 rounded-lg px-2 py-1.5 cursor-pointer"
                  >
                    <option value="all">📍 All Areas ({MASTER_HYDERABAD_DIRECTORY.length})</option>
                    {directoryAreas.map(a => (
                      <option key={a} value={a}>📍 {a}</option>
                    ))}
                  </select>

                  <select
                    value={modalSpice}
                    onChange={(e) => setModalSpice(e.target.value)}
                    className="bg-[#121624] border border-slate-700 text-slate-300 rounded-lg px-2 py-1.5 cursor-pointer"
                  >
                    <option value="all">🌶️ All Spices</option>
                    <option value="Mild">🟢 Mild</option>
                    <option value="Medium">🟡 Medium</option>
                    <option value="Spicy">🔴 Spicy</option>
                  </select>

                  <button
                    onClick={onLoadAll}
                    className="sm:hidden px-2.5 py-1.5 rounded-lg bg-amber-500 text-black font-extrabold text-[11px]"
                  >
                    Load All 26
                  </button>
                </div>
              </div>

              {/* Directory Spots Scroll Area */}
              <div className="p-4 overflow-y-auto flex-1 space-y-3">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {filteredDirectory.map(spot => {
                    const isOnBoard = activeSpotIds.includes(spot.id);
                    return (
                      <div
                        key={spot.id}
                        className={`rounded-2xl border p-3.5 flex flex-col justify-between gap-2.5 transition ${
                          isOnBoard
                            ? 'bg-slate-900/50 border-slate-800 opacity-80'
                            : 'bg-[#151a29] border-slate-700/80 hover:border-amber-500/60 shadow-md'
                        }`}
                      >
                        <div>
                          <div className="flex justify-between items-start gap-2">
                            <div>
                              <h4 className="font-extrabold text-white text-sm flex items-center gap-1.5">
                                {spot.name}
                                {spot.isSecretGem && (
                                  <span className="text-[9px] uppercase font-bold px-1.5 py-0.2 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">
                                    Gali Gem
                                  </span>
                                )}
                              </h4>
                              <span className="text-xs text-amber-400 font-medium">📍 {spot.location}</span>
                            </div>
                            <span className="text-xs font-mono font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
                              {spot.distance} km
                            </span>
                          </div>

                          <div className="bg-black/30 p-2.5 rounded-xl border border-slate-800/80 my-2 text-xs">
                            <p className="text-slate-200">
                              <strong className="text-amber-400">Must Order:</strong> {spot.dish}
                            </p>
                            <p className="text-[11px] text-slate-400 mt-0.5">
                              <strong>Parking:</strong> {spot.parking}
                            </p>
                          </div>
                        </div>

                        <div className="flex items-center justify-between pt-1 border-t border-slate-800">
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${
                            spot.spiceTier === 'Mild'
                              ? 'bg-emerald-950/60 text-emerald-300 border-emerald-600/50'
                              : spot.spiceTier === 'Medium'
                              ? 'bg-amber-950/60 text-amber-300 border-amber-600/50'
                              : 'bg-red-950/60 text-red-300 border-red-600/50'
                          }`}>
                            {spot.spiceTier} Spice ({spot.spiceLevel}/5)
                          </span>

                          {isOnBoard ? (
                            <span className="text-xs font-bold text-emerald-400 flex items-center gap-1 px-3 py-1 rounded-lg bg-emerald-950/30 border border-emerald-800/40">
                              ✓ Already on Card
                            </span>
                          ) : (
                            <button
                              onClick={() => onAddSpot(spot)}
                              className="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-amber-500 to-zafran-600 hover:from-amber-400 hover:to-zafran-500 text-black font-extrabold text-xs shadow-md transition active:scale-95 flex items-center gap-1 cursor-pointer"
                            >
                              <span>➕ Put on Card</span>
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Modal Footer */}
              <div className="p-3 border-t border-slate-800 bg-[#151a2b] flex items-center justify-between text-xs text-slate-400">
                <span>Showing {filteredDirectory.length} of {MASTER_HYDERABAD_DIRECTORY.length} spots in master database</span>
                <button
                  onClick={onClose}
                  className="px-4 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold transition"
                >
                  Done
                </button>
              </div>
            </div>
          </div>
        );
      }

      // Render the App
      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
  </body>
</html>
